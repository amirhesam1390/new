name: Build Gapira Classic Android

on:
  push:
    branches:
      - classic
      - master
  pull_request:
    branches:
      - classic
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gapira-classic-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Gapira ARM32 + ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Gapira Classic
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Project
        run: |
          set -e
          test -f gradlew
          test -f settings.gradle
          test -f TMessagesProj/build.gradle
          test -f TMessagesProj_App/build.gradle
          test -f TMessagesProj_Modules/media/core_settings.gradle
          echo "Gapira Classic source verification passed."
          git submodule status --recursive

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          PROPS
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gapira-classic-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gapira-classic-gradle-${{ runner.os }}-

      - name: Check Build Environment
        run: |
          java -version
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
          df -h
          free -h

      - name: Build Gapira Classic APK
        run: |
          ./gradlew \
            :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            --build-cache

      - name: Verify ARM Architectures
        run: |
          set -e
          FOUND=0

          while IFS= read -r APK; do
            if unzip -l "$APK" | grep -q 'lib/armeabi-v7a/' &&
               unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
              echo "ARM32 + ARM64 verified: $APK"
              FOUND=1
              break
            fi
          done < <(find . -type f -name "*.apk")

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: APK with both ARM architectures was not found."
            exit 1
          fi

      - name: List APK Files
        run: |
          find . -type f -name "*.apk" -exec ls -lh {} \;
          find . -type f -name "*.apk" | grep -q .

      - name: Upload Gapira Classic APK
        uses: actions/upload-artifact@v4
        with:
          name: Gapira-Classic-Android-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Build Report
        if: always()
        run: |
          echo "Gapira Classic build finished."
          df -h
